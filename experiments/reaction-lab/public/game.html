<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>刹那のぷゆり</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  [hidden] { display: none !important; }

  :root {
    --dark: #07070b;
    --dim: #5b5b70;
    --cue-bg: #fff6e2;
    --cue-fg: #16161c;
    --win: #5ad39a; --lose: #ef6a5f; --draw: #e0bc55; --muted: #7d7d92;
    --blade: #fff;
  }

  body {
    background: var(--dark); color: #ececf3;
    font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: fixed; inset: 0; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1rem; padding: 1.2rem; box-sizing: border-box; text-align: center;
    touch-action: manipulation;
    /* 対峙の空気。暗い中央から周辺に落ちる */
    background:
      radial-gradient(ellipse 120% 80% at 50% 50%, #12121c 0%, var(--dark) 70%);
  }
  /* 合図はここで一段に切り替わる。transition は絶対に付けない */
  #stage.cue { background: var(--cue-bg); color: var(--cue-fg); }

  /* ---------------- 対峙 ---------------- */

  #arena {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    width: 100%; max-width: 34rem; gap: .4rem;
  }
  .fighter { display: flex; flex-direction: column; align-items: center; gap: .3rem; }
  .fighter .face {
    font-size: clamp(38px, 13vmin, 74px); line-height: 1;
    filter: grayscale(.55) brightness(.62);
  }
  /* 向かい合わせる。右は反転 */
  #foe .face { transform: scaleX(-1); }
  .fighter .tag {
    font-size: clamp(10px, 2.8vmin, 12px); color: var(--dim); letter-spacing: .12em;
  }
  /* 間合い。二人を隔てる線 */
  #ma {
    width: clamp(40px, 18vmin, 120px); height: 1px;
    background: linear-gradient(90deg, transparent, #2a2a3a 30%, #2a2a3a 70%, transparent);
  }

  /* ---------------- 合図 ---------------- */

  /* 絶対配置にすると「いま」を覆ってしまうので、通常の流れに置く */
  #cue { display: flex; align-items: center; justify-content: center; }
  #cueFace { font-size: clamp(88px, 34vmin, 220px); line-height: 1; }

  /* ---------------- 文字 ---------------- */

  #lead { font-size: clamp(19px, 5.6vmin, 32px); font-weight: 800; letter-spacing: .1em; }
  #stage.armed #lead { color: #3f3f52; font-weight: 500; letter-spacing: .5em; }
  #stage.cue #lead { color: var(--cue-fg); }
  #sub { color: var(--muted); font-size: clamp(12px, 3.2vmin, 14px); max-width: 30rem; white-space: pre-line; min-height: 1.2em; }
  #stage.cue #sub { color: #6b6b78; }
  .rule { line-height: 2.1; }

  .times { display: grid; grid-template-columns: auto auto; gap: .1rem 1.1rem; font-variant-numeric: tabular-nums; }
  .times .k { color: var(--muted); text-align: right; font-size: .88em; }
  .times .v { text-align: left; font-weight: 800; }
  .win { color: var(--win); } .lose { color: var(--lose); } .draw { color: var(--draw); }

  button {
    font: inherit; font-weight: 700; padding: .8rem 2rem; border-radius: 999px;
    border: 2px solid currentColor; background: transparent; color: inherit; cursor: pointer;
    min-height: 48px; touch-action: manipulation;
  }
  .note { font-size: clamp(11px, 2.8vmin, 12px); color: var(--muted); }
  .dot { display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: var(--lose); vertical-align: middle; }
  .dot.on { background: var(--win); }
  #stage.armed #status, #stage.cue #status { visibility: hidden; }

  #mute {
    position: absolute; top: .6rem; right: .6rem; padding: .3rem .7rem; min-height: 0;
    font-size: 12px; font-weight: 500; border-width: 1px; color: var(--dim); opacity: .8;
  }
  #stage.armed #mute, #stage.cue #mute { visibility: hidden; }

  /* ---------------- 決着の演出 ----------------
     合図より後なので、ここは自由に動かしてよい。計測には一切影響しない */

  #slash {
    position: absolute; left: -20%; right: -20%; top: 50%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--blade), transparent);
    opacity: 0; transform: scaleX(0) rotate(-14deg); transform-origin: left center;
  }
  #stage.strike #slash { animation: slash .26s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes slash {
    0%   { opacity: 0; transform: scaleX(0) rotate(-14deg); }
    12%  { opacity: 1; }
    70%  { opacity: 1; transform: scaleX(1) rotate(-14deg); }
    100% { opacity: 0; transform: scaleX(1) rotate(-14deg); }
  }
  #stage.strike { animation: shake .2s ease-out; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-4px, 2px); }
    50% { transform: translate(3px, -2px); }
    75% { transform: translate(-2px, 1px); }
  }

  .fighter.fell .face { animation: fall .5s .12s cubic-bezier(.4,0,.7,1) forwards; }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(34%) rotate(78deg); opacity: .18; }
  }
  #foe.fighter.fell .face { animation-name: fallFoe; }
  @keyframes fallFoe {
    0%   { transform: scaleX(-1) translateY(0) rotate(0); opacity: 1; }
    100% { transform: scaleX(-1) translateY(34%) rotate(78deg); opacity: .18; }
  }
  .fighter.stood .face {
    filter: none; animation: stand .34s .1s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes stand { 0% { transform: scale(1); } 55% { transform: scale(1.16); } 100% { transform: scale(1.06); } }
  #foe.fighter.stood .face { animation-name: standFoe; }
  @keyframes standFoe {
    0% { transform: scaleX(-1) scale(1); } 55% { transform: scaleX(-1) scale(1.16); } 100% { transform: scaleX(-1) scale(1.06); }
  }
  .fighter.lit .face { filter: none; }

  @media (prefers-reduced-motion: reduce) {
    #stage.strike, #stage.strike #slash,
    .fighter.fell .face, .fighter.stood .face { animation: none !important; }
    .fighter.fell .face { opacity: .22; }
    .fighter.stood .face { filter: none; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="arena" hidden>
      <div class="fighter" id="me"><div class="face">🥺</div><div class="tag">あなた</div></div>
      <div id="ma"></div>
      <div class="fighter" id="foe"><div class="face">🥺</div><div class="tag">あいて</div></div>
    </div>
    <div id="cue" hidden><div id="cueFace">🥺</div></div>
    <div id="lead">接続しています</div>
    <div id="times" class="times" hidden></div>
    <div id="sub"></div>
    <button id="action" hidden></button>
    <div id="status" class="note"></div>
    <button id="mute" title="音のオン/オフ">♪ オン</button>
    <div id="slash"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
