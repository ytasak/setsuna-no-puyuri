<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>刹那のぷゆり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  [hidden] { display: none !important; }

  :root {
    --win: #6ee7a8; --lose: #ff7a6d; --draw: #f0c95e; --muted: #8e8ba0;
    --ink: #f2eee6;
    /* 見出し用の筆書体。読み込めなくても明朝系に落ちる */
    --brush: "Reggae One", "Klee One", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  }

  body {
    background: #06060c; color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: fixed; inset: 0; overflow: hidden;
    display: flex; flex-direction: column;
    touch-action: manipulation; text-align: center;
  }

  /* ---------------- 舞台 ----------------
     夜の空から地平線へ落ちる。二人はその地平に立つ */

  /* 空。ここに月と合図が出る */
  #sky {
    position: relative; flex: 1 1 auto; min-height: 0;
    background: linear-gradient(#05050e 0%, #0c0920 38%, #221436 68%, #4e2340 88%, #8c3b50 100%);
  }
  /* 星。静止した点。合図待ちでは瞬きも止める */
  #stars {
    position: absolute; left: 0; right: 0; top: 0; height: 76%;
    background-image:
      radial-gradient(1.5px 1.5px at 8% 22%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 17% 9%,  #ffeedd, transparent),
      radial-gradient(1px 1px     at 31% 31%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 39% 14%, #fff, transparent),
      radial-gradient(1px 1px     at 47% 38%, #e8ddff, transparent),
      radial-gradient(1.3px 1.3px at 56% 7%,  #fff, transparent),
      radial-gradient(1px 1px     at 63% 27%, #ffeedd, transparent),
      radial-gradient(1.5px 1.5px at 71% 17%, #fff, transparent),
      radial-gradient(1px 1px     at 79% 41%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 86% 11%, #e8ddff, transparent),
      radial-gradient(1px 1px     at 93% 29%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 24% 48%, #fff, transparent),
      radial-gradient(1px 1px     at 68% 52%, #ffeedd, transparent),
      radial-gradient(1.1px 1.1px at 4% 44%,  #fff, transparent);
    opacity: .8; animation: twinkle 4.5s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .82; } 50% { opacity: .52; } }

  /* 雲。ゆっくり流れる */
  #clouds { position: absolute; left: 0; right: 0; top: 18%; height: 40%; overflow: hidden; }
  #clouds i {
    position: absolute; display: block; border-radius: 50%;
    background: rgba(255,186,166,.085); filter: blur(16px);
    animation: drift 90s linear infinite;
  }
  #clouds i:nth-child(1) { width: 46%; height: 26%; left: -50%; top: 8%;  animation-duration: 96s; }
  #clouds i:nth-child(2) { width: 34%; height: 18%; left: -40%; top: 44%; animation-duration: 72s; animation-delay: -30s; }
  #clouds i:nth-child(3) { width: 58%; height: 22%; left: -60%; top: 68%; animation-duration: 120s; animation-delay: -60s; }
  @keyframes drift { to { transform: translateX(280%); } }

  /* 山の稜線。遠近2枚。山は動かない */
  .ridge { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; display: block; }
  #ridgeFar  { height: clamp(46px, 13vmin, 110px); fill: #2b1b3c; opacity: .75; bottom: 6%; }
  #ridgeNear { height: clamp(34px, 9.5vmin, 82px); fill: #130c1e; bottom: 0; }

  /* 草。風になびく */
  .grass {
    position: absolute; left: -6%; right: -6%; bottom: 0;
    transform-origin: bottom center;
    animation: sway 5.5s ease-in-out infinite;
    -webkit-mask-image: linear-gradient(to top, #000 18%, transparent 100%);
    mask-image: linear-gradient(to top, #000 18%, transparent 100%);
  }
  /* 奥の草。細かく低い */
  #grassBack {
    height: clamp(12px, 2.8vmin, 22px);
    background: repeating-linear-gradient(92deg, #1a1026 0 1.5px, transparent 1.5px 5px);
    animation-duration: 7s;
  }
  /* 手前の草。太く高い */
  #grassFront {
    height: clamp(18px, 4.4vmin, 34px);
    background: repeating-linear-gradient(95deg, #07060c 0 2.4px, transparent 2.4px 9px);
    animation-duration: 5.2s; animation-delay: -1.6s;
  }
  @keyframes sway { 0%,100% { transform: skewX(-3deg); } 50% { transform: skewX(3deg); } }

  /* 構えた瞬間に風が止まる。
     動くものを残すと合図の描画が遅れかねないうえ、止まること自体が緊張になる */
  #stage.armed .grass, #stage.cue .grass { animation: none; transform: skewX(0deg); }
  #stage.armed #clouds i, #stage.cue #clouds i { animation-play-state: paused; }
  #stage.armed #stars, #stage.cue #stars { animation: none; opacity: .82; }

  #moon {
    position: absolute; top: 14%; left: 22%;
    width: clamp(26px, 7vmin, 46px); aspect-ratio: 1; border-radius: 50%;
    background: #f6efdb; box-shadow: 0 0 30px rgba(246,239,219,.28), 0 0 80px rgba(246,239,219,.1);
  }
  /* 地面。この上端が地平線で、二人はそこに立つ */
  #ground {
    position: relative; flex: 0 0 auto; min-height: 9rem;
    background: linear-gradient(#0b0711 0%, #06060b 60%);
    box-shadow: 0 -1px 0 rgba(255,190,150,.5), 0 -14px 34px -10px rgba(255,140,90,.25);
  }
  /* 合図で舞台が一段明るくなる。transition は付けない */
  #stage.cue #sky { filter: brightness(2.5) saturate(.55); }
  #stage.cue #ridgeFar, #stage.cue #ridgeNear { opacity: .5; }
  #stage.cue #ground { filter: brightness(2.2); }
  #stage.cue #moon { box-shadow: 0 0 56px rgba(255,255,255,.55); }

  /* ---------------- 対峙 ---------------- */

  /* 地平線の上に立たせる。地面の上端から自分の高さぶん持ち上げる */
  #arena {
    position: absolute; left: 0; right: 0; top: 0; transform: translateY(-100%);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: end;
    width: min(100%, 30rem); margin: 0 auto; padding: 0 1.5rem;
    box-sizing: border-box; z-index: 2;
  }
  .fighter { position: relative; display: flex; flex-direction: column; align-items: center; gap: .25rem; transform: translateY(4%); }
  .fighter .face {
    font-size: clamp(40px, 14vmin, 80px); line-height: 1;
    filter: brightness(.42) contrast(1.15) saturate(.5);
  }
  /* 向かい合わせ、わずかに前傾させて構えを出す。静止したまま動かさない */
  #me  .face { transform: rotate(9deg); }
  #foe .face { transform: scaleX(-1) rotate(9deg); }
  #stage.cue .fighter .face, #stage.result .fighter .face { filter: none; }
  .fighter .tag {
    font-size: clamp(9px, 2.6vmin, 11px); color: #8d7f8f; letter-spacing: .14em;
    text-shadow: 0 1px 2px #000;
    /* 倒れ込むのに合わせて遅れて沈む。先に名前だけ暗くなると決着より早くネタバレする */
    transition: color .45s .3s;
  }
  #ma { width: clamp(30px, 14vmin, 90px); }

  /* ---------------- 合図 ----------------
     対峙の構図はそのままに、画面の中央に出す */

  /* 対峙の構図を崩さず、画面の中央に出す */
  #cue {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); z-index: 4;
    font-family: var(--brush);
    font-size: clamp(56px, 18vmin, 150px); letter-spacing: .02em;
    color: #fff; white-space: nowrap;
    /* 墨の輪郭を重ねて太らせる */
    text-shadow:
      0 0 26px rgba(255,216,130,.95),
      3px 0 0 #8f2f1c, -3px 0 0 #8f2f1c, 0 3px 0 #8f2f1c, 0 -3px 0 #8f2f1c,
      2px 2px 0 #8f2f1c, -2px 2px 0 #8f2f1c, 2px -2px 0 #8f2f1c, -2px -2px 0 #8f2f1c,
      0 9px 0 #5d1b10, 0 14px 28px rgba(0,0,0,.7);
  }

  /* ---------------- HUD（地面側） ---------------- */

  #hud {
    position: relative; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .4rem; padding: .8rem 1rem; box-sizing: border-box; height: 100%;
  }
  #lead {
    font-family: var(--brush);
    font-size: clamp(21px, 6vmin, 36px); letter-spacing: .1em;
    text-shadow: 0 2px 0 rgba(0,0,0,.7), 0 6px 16px rgba(0,0,0,.5);
  }
  #stage.armed #lead { color: #7a687c; letter-spacing: .5em; text-shadow: none; }
  #stage.result #lead {
    font-size: clamp(26px, 8vmin, 46px);
    text-shadow: 0 0 22px currentColor, 0 3px 0 rgba(0,0,0,.8), 0 8px 20px rgba(0,0,0,.6);
  }
  #sub { color: var(--muted); font-size: clamp(11px, 3vmin, 13px); white-space: pre-line; min-height: 1.1em; }
  .rule { line-height: 2; }

  .times { display: grid; grid-template-columns: auto auto; gap: 0 1rem; font-variant-numeric: tabular-nums; }
  .times .k { color: var(--muted); text-align: right; font-size: .85em; font-family: var(--brush); }
  .times .v { text-align: left; font-weight: 800; font-size: 1.05em; }
  .win { color: var(--win); } .lose { color: var(--lose); } .draw { color: var(--draw); }

  button {
    font: inherit; font-family: var(--brush); padding: .7rem 1.9rem; border-radius: 999px;
    border: 2px solid currentColor; background: rgba(0,0,0,.35); color: inherit; cursor: pointer;
    min-height: 48px; touch-action: manipulation;
  }
  .note { font-size: clamp(10px, 2.6vmin, 12px); color: #6a6a7c; }
  .dot { display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: var(--lose); vertical-align: middle; }
  .dot.on { background: var(--win); }
  #stage.armed #status, #stage.cue #status { visibility: hidden; }

  /* 当日の戦績。地面側に小さく出す */
  #mine {
    font-size: clamp(10px, 2.7vmin, 12px); color: #9a90a8;
    display: flex; gap: .85rem; flex-wrap: wrap; justify-content: center;
    font-variant-numeric: tabular-nums;
  }
  #mine b { color: #e4dcec; font-weight: 700; }
  #mine .warn { color: var(--draw); }
  #stage.armed #mine, #stage.cue #mine { visibility: hidden; }

  /* 当日ランキング */
  #board {
    position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: .8rem; padding: 1.2rem;
    background: rgba(5,5,11,.94); box-sizing: border-box; overflow-y: auto;
  }
  #board h2 { font-family: var(--brush); font-size: clamp(19px, 5.6vmin, 30px); margin: 0; }
  #board .reset { font-size: clamp(10px, 2.7vmin, 12px); color: var(--muted); }
  .lists { display: flex; gap: clamp(.9rem, 5vw, 2.6rem); flex-wrap: wrap; justify-content: center; }
  .list { min-width: 8.5rem; }
  .list h3 {
    font-family: var(--brush); font-size: clamp(13px, 3.6vmin, 16px);
    margin: 0 0 .35rem; color: #cbbdd6; font-weight: 400;
  }
  .list ol { margin: 0; padding: 0; list-style: none; font-size: clamp(11px, 3vmin, 13px); }
  .list li {
    display: flex; justify-content: space-between; gap: .7rem; padding: .16rem 0;
    font-variant-numeric: tabular-nums; border-bottom: 1px solid #201a2c;
  }
  .list li .r { color: var(--muted); width: 1.2em; }
  .list li .n { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list li .v { font-weight: 700; }
  .list li.me { color: var(--draw); }
  .list .empty { color: var(--muted); font-size: .92em; padding: .3rem 0; }

  #mute {
    position: absolute; top: .5rem; right: .5rem; padding: .25rem .65rem; min-height: 0;
    font-family: system-ui, sans-serif; font-size: 11px; font-weight: 500;
    border-width: 1px; color: #6a6a7c; z-index: 5;
  }
  #stage.armed #mute, #stage.cue #mute { visibility: hidden; }

  /* ---------------- 決着 ----------------
     合図より後なので計測に影響しない。ここは派手にやる */

  #flash {
    position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 6;
  }
  #stage.strike #flash { animation: flash .34s ease-out forwards; }
  @keyframes flash { 0% { opacity: .92; } 30% { opacity: .3; } 100% { opacity: 0; } }

  .blade {
    position: absolute; left: -30%; right: -30%; top: 62%; height: 3px; opacity: 0; z-index: 5;
    background: linear-gradient(90deg, transparent, #fff 35%, #fff 65%, transparent);
    filter: drop-shadow(0 0 8px rgba(255,240,200,.95));
    transform-origin: center;
  }
  .blade.b2 { top: 57%; height: 1.5px; }
  .blade.b3 { top: 67%; height: 1.5px; }
  #stage.strike .blade   { animation: cutR .3s cubic-bezier(.15,.85,.25,1) forwards; }
  #stage.strike .blade.b2 { animation-delay: .05s; animation-duration: .26s; }
  #stage.strike .blade.b3 { animation-delay: .09s; animation-duration: .24s; }
  #stage.strike.left .blade { animation-name: cutL; }
  @keyframes cutR {
    0%   { opacity: 0; transform: translateX(-42%) scaleX(.1) rotate(-11deg); }
    10%  { opacity: 1; }
    62%  { opacity: 1; transform: translateX(0) scaleX(1) rotate(-11deg); }
    100% { opacity: 0; transform: translateX(24%) scaleX(1) rotate(-11deg); }
  }
  @keyframes cutL {
    0%   { opacity: 0; transform: translateX(42%) scaleX(.1) rotate(11deg); }
    10%  { opacity: 1; }
    62%  { opacity: 1; transform: translateX(0) scaleX(1) rotate(11deg); }
    100% { opacity: 0; transform: translateX(-24%) scaleX(1) rotate(11deg); }
  }

  #stage.strike #sky, #stage.strike #ground { animation: quake .36s ease-out; }
  @keyframes quake {
    0%,100% { transform: translate(0,0); }
    10% { transform: translate(-9px, 5px); }
    25% { transform: translate(8px, -6px); }
    42% { transform: translate(-6px, 3px); }
    60% { transform: translate(4px, -2px); }
    80% { transform: translate(-2px, 1px); }
  }

  /* 居合。合図までは鞘の中で、抜く瞬間まで見えない。
     opacity:0 で置いておくので、構えている間に刀が見えることはない。

     🔪 は既定で「柄が左上・切っ先が右下」を向いている（＝+45°）。
     rotate(-45deg) で水平に右を向く。回転角はこれを基準に置いた。

       鞘の中 → 抜き上げて一閃 → 振り抜き → 切っ先を相手に向けて残心

     閃光が最も明るいのが最初の 0.1 秒で、抜く動作はその下で起きる。
     居合が「見えないほど速い」のはそれで出る */
  .fighter .knife {
    position: absolute; left: 50%; top: 24%;
    width: 1em; height: 1em; margin-left: -.5em;
    font-size: clamp(25px, 8.6vmin, 50px); line-height: 1;
    display: grid; place-items: center;
    opacity: 0; pointer-events: none; z-index: 3;
  }
  #me.iai  .knife { animation: iaiL .9s cubic-bezier(.2,.9,.3,1) forwards; }
  #foe.iai .knife { animation: iaiR .9s cubic-bezier(.2,.9,.3,1) forwards; }
  /* 移動量は刀自身の一辺（1em）が単位。顔の半分がおよそ 90% にあたるので、
     150% で顔の外に出て「前に構えている」形になる */
  @keyframes iaiL {
    0%   { opacity: 0; transform: translate(-70%, 58%) rotate(120deg) scale(.55); filter: none; }
    9%   { opacity: 1; transform: translate(-46%, 46%) rotate(102deg) scale(.85); filter: drop-shadow(0 0 10px rgba(255,245,210,.95)); }
    26%  { opacity: 1; transform: translate(100%, -58%) rotate(-84deg) scale(1.2); filter: drop-shadow(0 0 16px rgba(255,245,210,1)); }
    46%  { opacity: 1; transform: translate(188%, 40%) rotate(6deg) scale(1.05); filter: drop-shadow(0 0 12px rgba(255,245,210,.95)); }
    72%  { opacity: 1; transform: translate(142%, 46%) rotate(-10deg) scale(1); filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
    100% { opacity: 1; transform: translate(142%, 46%) rotate(-10deg) scale(1); filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  }
  @keyframes iaiR {
    0%   { opacity: 0; transform: scaleX(-1) translate(-70%, 58%) rotate(120deg) scale(.55); filter: none; }
    9%   { opacity: 1; transform: scaleX(-1) translate(-46%, 46%) rotate(102deg) scale(.85); filter: drop-shadow(0 0 10px rgba(255,245,210,.95)); }
    26%  { opacity: 1; transform: scaleX(-1) translate(100%, -58%) rotate(-84deg) scale(1.2); filter: drop-shadow(0 0 16px rgba(255,245,210,1)); }
    46%  { opacity: 1; transform: scaleX(-1) translate(188%, 40%) rotate(6deg) scale(1.05); filter: drop-shadow(0 0 12px rgba(255,245,210,.95)); }
    72%  { opacity: 1; transform: scaleX(-1) translate(142%, 46%) rotate(-10deg) scale(1); filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
    100% { opacity: 1; transform: scaleX(-1) translate(142%, 46%) rotate(-10deg) scale(1); filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  }

  /* 敗者は画面に残したまま、その場で倒れ込む。
     画面外へ飛ばすと決着の絵が片方だけになって寂しい。
     倒れた姿が残っているほうが勝敗が一目で分かる。
       のけぞる → 傾く → ひっくりかえって倒れ込む
     大きさは変えず、暗く沈めるだけにする */
  #me.fallen  .face { animation: fallL .8s .08s cubic-bezier(.3,.85,.35,1) forwards; }
  #foe.fallen .face { animation: fallR .8s .08s cubic-bezier(.3,.85,.35,1) forwards; }
  @keyframes fallL {
    0%   { transform: rotate(9deg) scale(1); filter: none; }
    16%  { transform: translate(7%, -13%) rotate(-7deg) scale(1.05); filter: brightness(1.25); }
    52%  { transform: translate(-13%, 4%) rotate(-96deg) scale(1); filter: brightness(.75) saturate(.7); }
    82%  { transform: translate(-21%, 17%) rotate(-172deg) scale(1); filter: brightness(.42) saturate(.5); }
    100% { transform: translate(-20%, 15%) rotate(-166deg) scale(1); filter: brightness(.4) saturate(.45); }
  }
  @keyframes fallR {
    0%   { transform: scaleX(-1) rotate(9deg) scale(1); filter: none; }
    16%  { transform: scaleX(-1) translate(7%, -13%) rotate(-7deg) scale(1.05); filter: brightness(1.25); }
    52%  { transform: scaleX(-1) translate(-13%, 4%) rotate(-96deg) scale(1); filter: brightness(.75) saturate(.7); }
    82%  { transform: scaleX(-1) translate(-21%, 17%) rotate(-172deg) scale(1); filter: brightness(.42) saturate(.5); }
    100% { transform: scaleX(-1) translate(-20%, 15%) rotate(-166deg) scale(1); filter: brightness(.4) saturate(.45); }
  }
  /* 敗者は抜こうとして取り落とす。刀は地面に突き刺さって残る。
     勝った側が構えたままなのに対して、負けた側は手元に何もない。
     斬られた側だと一目で分かる */
  #me.fallen  .knife { animation: dropL 1s .06s cubic-bezier(.35,.7,.4,1) forwards; }
  #foe.fallen .knife { animation: dropR 1s .06s cubic-bezier(.35,.7,.4,1) forwards; }
  @keyframes dropL {
    0%   { opacity: 0; transform: translate(-70%, 58%) rotate(120deg) scale(.55); filter: none; }
    12%  { opacity: 1; transform: translate(-34%, 30%) rotate(94deg) scale(.9); filter: brightness(1.1); }
    34%  { opacity: 1; transform: translate(52%, -26%) rotate(18deg) scale(1); filter: brightness(.95); }
    62%  { opacity: 1; transform: translate(112%, 34%) rotate(-2deg) scale(1); filter: brightness(.8) saturate(.8); }
    86%  { opacity: 1; transform: translate(126%, 78%) rotate(70deg) scale(1); filter: brightness(.55) saturate(.6); }
    94%  { opacity: 1; transform: translate(126%, 69%) rotate(60deg) scale(1); filter: brightness(.5) saturate(.55); }
    100% { opacity: 1; transform: translate(126%, 74%) rotate(64deg) scale(1); filter: brightness(.5) saturate(.55); }
  }
  @keyframes dropR {
    0%   { opacity: 0; transform: scaleX(-1) translate(-70%, 58%) rotate(120deg) scale(.55); filter: none; }
    12%  { opacity: 1; transform: scaleX(-1) translate(-34%, 30%) rotate(94deg) scale(.9); filter: brightness(1.1); }
    34%  { opacity: 1; transform: scaleX(-1) translate(52%, -26%) rotate(18deg) scale(1); filter: brightness(.95); }
    62%  { opacity: 1; transform: scaleX(-1) translate(112%, 34%) rotate(-2deg) scale(1); filter: brightness(.8) saturate(.8); }
    86%  { opacity: 1; transform: scaleX(-1) translate(126%, 78%) rotate(70deg) scale(1); filter: brightness(.55) saturate(.6); }
    94%  { opacity: 1; transform: scaleX(-1) translate(126%, 69%) rotate(60deg) scale(1); filter: brightness(.5) saturate(.55); }
    100% { opacity: 1; transform: scaleX(-1) translate(126%, 74%) rotate(64deg) scale(1); filter: brightness(.5) saturate(.55); }
  }

  /* 倒れた側の名前も一緒に沈める */
  .fighter.fallen .tag { color: #4b4353; }
  /* 勝者は残心 */
  #me.zanshin  .face { animation: zanL .5s .08s cubic-bezier(.2,1.5,.35,1) both; }
  #foe.zanshin .face { animation: zanR .5s .08s cubic-bezier(.2,1.5,.35,1) both; }
  @keyframes zanL {
    0% { transform: rotate(9deg) scale(1); }
    30% { transform: rotate(-6deg) scale(1.3); }
    100% { transform: rotate(0deg) scale(1.14); }
  }
  @keyframes zanR {
    0% { transform: scaleX(-1) rotate(9deg) scale(1); }
    30% { transform: scaleX(-1) rotate(-6deg) scale(1.3); }
    100% { transform: scaleX(-1) rotate(0deg) scale(1.14); }
  }
  .fighter.zanshin .face { filter: drop-shadow(0 0 16px rgba(255,230,170,.85)) !important; }

  #stage.result #lead { animation: slam .3s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes slam { 0% { transform: scale(2.1); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    /* #field は空と地面に分ける前の名前で、いまは存在しない。
       揺れが止まらなくなっていたので #sky と #ground に直した */
    #stage.strike #flash, #stage.strike .blade, #stage.strike #sky, #stage.strike #ground,
    .fighter.fallen .face, .fighter.zanshin .face, .fighter.iai .knife, .fighter.fallen .knife,
    #stage.result #lead { animation: none !important; }
    /* 振らないが、抜いて構えた形は見せる */
    #me.iai  .knife { opacity: 1; transform: translate(142%, 46%) rotate(-10deg); }
    #foe.iai .knife { opacity: 1; transform: scaleX(-1) translate(142%, 46%) rotate(-10deg); }
    #me.fallen  .knife { opacity: 1; transform: translate(126%, 74%) rotate(64deg); filter: brightness(.5) saturate(.55); }
    #foe.fallen .knife { opacity: 1; transform: scaleX(-1) translate(126%, 74%) rotate(64deg); filter: brightness(.5) saturate(.55); }
    /* 動かさないが、倒れた結果は静止画として見せる */
    #me.fallen  .face { transform: translate(-20%, 15%) rotate(-166deg); filter: brightness(.4) saturate(.45); }
    #foe.fallen .face { transform: scaleX(-1) translate(-20%, 15%) rotate(-166deg); filter: brightness(.4) saturate(.45); }
    .fighter.zanshin .face { filter: drop-shadow(0 0 14px rgba(255,230,170,.8)) !important; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="sky">
      <div id="stars"></div>
      <div id="clouds"><i></i><i></i><i></i></div>
      <div id="moon"></div>
      <svg id="ridgeFar" class="ridge" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,120 L0,74 L110,30 L196,62 L300,18 L418,70 L520,38 L642,78 L762,32 L884,66 L1002,26 L1122,64 L1200,44 L1200,120 Z"/>
      </svg>
      <svg id="ridgeNear" class="ridge" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,120 L0,90 L88,50 L172,86 L262,42 L362,92 L472,56 L584,94 L702,48 L824,88 L944,54 L1064,92 L1162,60 L1200,82 L1200,120 Z"/>
      </svg>
      <div id="grassBack" class="grass"></div>
      <div id="grassFront" class="grass"></div>
    </div>
    <div id="ground">
      <div id="arena" hidden>
        <div class="fighter" id="me"><div class="knife">🔪</div><div class="face">🥺</div><div class="tag">あなた</div></div>
        <div id="ma"></div>
        <div class="fighter" id="foe"><div class="knife">🔪</div><div class="face">🥺</div><div class="tag">あいて</div></div>
      </div>
      <div id="hud">
        <div id="lead">接続しています</div>
        <div id="times" class="times" hidden></div>
        <div id="sub"></div>
        <button id="action" hidden></button>
        <div id="mine"></div>
        <div id="status" class="note"></div>
      </div>
    </div>
    <div id="cue" hidden>ぷゆ！</div>
    <div class="blade b1"></div>
    <div class="blade b2"></div>
    <div class="blade b3"></div>
    <div id="flash"></div>
    <div id="board" hidden>
      <h2>きょうの記録</h2>
      <div class="lists">
        <div class="list"><h3>最速</h3><ol id="rankFast"></ol></div>
        <div class="list"><h3>連勝</h3><ol id="rankStreak"></ol></div>
      </div>
      <div class="reset" id="resetIn"></div>
      <button id="boardClose">閉じる</button>
    </div>
    <button id="mute" title="音のオン/オフ">♪ オン</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
