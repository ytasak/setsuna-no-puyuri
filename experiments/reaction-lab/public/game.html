<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>刹那のぷゆり</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  [hidden] { display: none !important; }

  :root {
    --win: #6ee7a8; --lose: #ff7a6d; --draw: #f0c95e; --muted: #8e8ba0;
    --ink: #f2eee6;
  }

  body {
    background: #06060c; color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: fixed; inset: 0; overflow: hidden;
    display: flex; flex-direction: column;
    touch-action: manipulation; text-align: center;
  }

  /* ---------------- 舞台 ----------------
     夜の空から地平線へ落ちる。二人はその地平に立つ */

  /* 空。ここに月と合図が出る */
  #sky {
    position: relative; flex: 1 1 auto; min-height: 0;
    background: linear-gradient(#05050e 0%, #0c0920 38%, #221436 68%, #4e2340 88%, #8c3b50 100%);
  }
  #moon {
    position: absolute; top: 14%; left: 22%;
    width: clamp(26px, 7vmin, 46px); aspect-ratio: 1; border-radius: 50%;
    background: #f6efdb; box-shadow: 0 0 30px rgba(246,239,219,.28), 0 0 80px rgba(246,239,219,.1);
  }
  /* 地面。この上端が地平線で、二人はそこに立つ */
  #ground {
    position: relative; flex: 0 0 auto; min-height: 9rem;
    background: linear-gradient(#0b0711 0%, #06060b 60%);
    box-shadow: 0 -1px 0 rgba(255,190,150,.5), 0 -14px 34px -10px rgba(255,140,90,.25);
  }
  /* 合図で舞台が一段明るくなる。transition は付けない */
  #stage.cue #sky { filter: brightness(2.5) saturate(.55); }
  #stage.cue #ground { filter: brightness(2.2); }
  #stage.cue #moon { box-shadow: 0 0 56px rgba(255,255,255,.55); }

  /* ---------------- 対峙 ---------------- */

  /* 地平線の上に立たせる。地面の上端から自分の高さぶん持ち上げる */
  #arena {
    position: absolute; left: 0; right: 0; top: 0; transform: translateY(-100%);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: end;
    width: min(100%, 30rem); margin: 0 auto; padding: 0 1.5rem;
    box-sizing: border-box; z-index: 2;
  }
  .fighter { display: flex; flex-direction: column; align-items: center; gap: .25rem; transform: translateY(4%); }
  .fighter .face {
    font-size: clamp(40px, 14vmin, 80px); line-height: 1;
    filter: brightness(.42) contrast(1.15) saturate(.5);
  }
  /* 向かい合わせ、わずかに前傾させて構えを出す。静止したまま動かさない */
  #me  .face { transform: rotate(9deg); }
  #foe .face { transform: scaleX(-1) rotate(9deg); }
  #stage.cue .fighter .face, #stage.result .fighter .face { filter: none; }
  .fighter .tag {
    font-size: clamp(9px, 2.6vmin, 11px); color: #8d7f8f; letter-spacing: .14em;
    text-shadow: 0 1px 2px #000;
  }
  #ma { width: clamp(30px, 14vmin, 90px); }

  /* ---------------- 合図 ----------------
     対峙の構図はそのままに、画面の中央に出す */

  /* 対峙の構図を崩さず、画面の中央に出す */
  #cue {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); z-index: 4;
    font-size: clamp(46px, 15vmin, 120px); font-weight: 900; letter-spacing: .04em;
    color: #fff; text-shadow: 0 0 18px rgba(255,220,140,.9), 0 4px 0 #b4482f, 0 8px 24px rgba(0,0,0,.6);
    white-space: nowrap;
  }

  /* ---------------- HUD（地面側） ---------------- */

  #hud {
    position: relative; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .4rem; padding: .8rem 1rem; box-sizing: border-box; height: 100%;
  }
  #lead { font-size: clamp(18px, 5.2vmin, 30px); font-weight: 800; letter-spacing: .12em; }
  #stage.armed #lead { color: #6a5a6a; font-weight: 500; letter-spacing: .55em; }
  #stage.result #lead { font-size: clamp(22px, 6.6vmin, 38px); }
  #sub { color: var(--muted); font-size: clamp(11px, 3vmin, 13px); white-space: pre-line; min-height: 1.1em; }
  .rule { line-height: 2; }

  .times { display: grid; grid-template-columns: auto auto; gap: 0 1rem; font-variant-numeric: tabular-nums; }
  .times .k { color: var(--muted); text-align: right; font-size: .85em; }
  .times .v { text-align: left; font-weight: 800; font-size: 1.05em; }
  .win { color: var(--win); } .lose { color: var(--lose); } .draw { color: var(--draw); }

  button {
    font: inherit; font-weight: 700; padding: .7rem 1.9rem; border-radius: 999px;
    border: 2px solid currentColor; background: rgba(0,0,0,.35); color: inherit; cursor: pointer;
    min-height: 48px; touch-action: manipulation;
  }
  .note { font-size: clamp(10px, 2.6vmin, 12px); color: #6a6a7c; }
  .dot { display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: var(--lose); vertical-align: middle; }
  .dot.on { background: var(--win); }
  #stage.armed #status, #stage.cue #status { visibility: hidden; }

  #mute {
    position: absolute; top: .5rem; right: .5rem; padding: .25rem .65rem; min-height: 0;
    font-size: 11px; font-weight: 500; border-width: 1px; color: #6a6a7c; z-index: 5;
  }
  #stage.armed #mute, #stage.cue #mute { visibility: hidden; }

  /* ---------------- 決着 ----------------
     合図より後なので計測に影響しない。ここは派手にやる */

  #flash {
    position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 6;
  }
  #stage.strike #flash { animation: flash .34s ease-out forwards; }
  @keyframes flash { 0% { opacity: .92; } 30% { opacity: .3; } 100% { opacity: 0; } }

  .blade {
    position: absolute; left: -30%; right: -30%; top: 62%; height: 3px; opacity: 0; z-index: 5;
    background: linear-gradient(90deg, transparent, #fff 35%, #fff 65%, transparent);
    filter: drop-shadow(0 0 8px rgba(255,240,200,.95));
    transform-origin: center;
  }
  .blade.b2 { top: 57%; height: 1.5px; }
  .blade.b3 { top: 67%; height: 1.5px; }
  #stage.strike .blade   { animation: cutR .3s cubic-bezier(.15,.85,.25,1) forwards; }
  #stage.strike .blade.b2 { animation-delay: .05s; animation-duration: .26s; }
  #stage.strike .blade.b3 { animation-delay: .09s; animation-duration: .24s; }
  #stage.strike.left .blade { animation-name: cutL; }
  @keyframes cutR {
    0%   { opacity: 0; transform: translateX(-42%) scaleX(.1) rotate(-11deg); }
    10%  { opacity: 1; }
    62%  { opacity: 1; transform: translateX(0) scaleX(1) rotate(-11deg); }
    100% { opacity: 0; transform: translateX(24%) scaleX(1) rotate(-11deg); }
  }
  @keyframes cutL {
    0%   { opacity: 0; transform: translateX(42%) scaleX(.1) rotate(11deg); }
    10%  { opacity: 1; }
    62%  { opacity: 1; transform: translateX(0) scaleX(1) rotate(11deg); }
    100% { opacity: 0; transform: translateX(-24%) scaleX(1) rotate(11deg); }
  }

  #stage.strike #sky, #stage.strike #ground { animation: quake .36s ease-out; }
  @keyframes quake {
    0%,100% { transform: translate(0,0); }
    10% { transform: translate(-9px, 5px); }
    25% { transform: translate(8px, -6px); }
    42% { transform: translate(-6px, 3px); }
    60% { transform: translate(4px, -2px); }
    80% { transform: translate(-2px, 1px); }
  }

  /* 敗者は吹き飛ぶ */
  #me.blown  .face { animation: blowL .62s .1s cubic-bezier(.16,.7,.3,1) forwards; }
  #foe.blown .face { animation: blowR .62s .1s cubic-bezier(.16,.7,.3,1) forwards; }
  @keyframes blowL {
    0%   { transform: rotate(9deg); opacity: 1; }
    22%  { transform: translate(26%, -40%) rotate(-90deg) scale(1.05); opacity: 1; }
    100% { transform: translate(-150%, 60%) rotate(-560deg) scale(.55); opacity: 0; }
  }
  @keyframes blowR {
    0%   { transform: scaleX(-1) rotate(9deg); opacity: 1; }
    22%  { transform: scaleX(-1) translate(26%, -40%) rotate(-90deg) scale(1.05); opacity: 1; }
    100% { transform: scaleX(-1) translate(-150%, 60%) rotate(-560deg) scale(.55); opacity: 0; }
  }
  /* 勝者は残心 */
  #me.zanshin  .face { animation: zanL .5s .08s cubic-bezier(.2,1.5,.35,1) both; }
  #foe.zanshin .face { animation: zanR .5s .08s cubic-bezier(.2,1.5,.35,1) both; }
  @keyframes zanL {
    0% { transform: rotate(9deg) scale(1); }
    30% { transform: rotate(-6deg) scale(1.3); }
    100% { transform: rotate(0deg) scale(1.14); }
  }
  @keyframes zanR {
    0% { transform: scaleX(-1) rotate(9deg) scale(1); }
    30% { transform: scaleX(-1) rotate(-6deg) scale(1.3); }
    100% { transform: scaleX(-1) rotate(0deg) scale(1.14); }
  }
  .fighter.zanshin .face { filter: drop-shadow(0 0 16px rgba(255,230,170,.85)) !important; }

  #stage.result #lead { animation: slam .3s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes slam { 0% { transform: scale(2.1); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    #stage.strike #flash, #stage.strike .blade, #stage.strike #field,
    .fighter.blown .face, .fighter.zanshin .face, #stage.result #lead { animation: none !important; }
    .fighter.blown .face { opacity: .15; }
    .fighter.zanshin .face { filter: drop-shadow(0 0 14px rgba(255,230,170,.8)) !important; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="sky">
      <div id="moon"></div>
    </div>
    <div id="ground">
      <div id="arena" hidden>
        <div class="fighter" id="me"><div class="face">🥺</div><div class="tag">あなた</div></div>
        <div id="ma"></div>
        <div class="fighter" id="foe"><div class="face">🥺</div><div class="tag">あいて</div></div>
      </div>
      <div id="hud">
        <div id="lead">接続しています</div>
        <div id="times" class="times" hidden></div>
        <div id="sub"></div>
        <button id="action" hidden></button>
        <div id="status" class="note"></div>
      </div>
    </div>
    <div id="cue" hidden>ぷゆ！</div>
    <div class="blade b1"></div>
    <div class="blade b2"></div>
    <div class="blade b3"></div>
    <div id="flash"></div>
    <button id="mute" title="音のオン/オフ">♪ オン</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
