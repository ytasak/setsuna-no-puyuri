<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>刹那のぷゆり</title>
<style>
  /* iframe 内で高さが不定なので 100vh を使わず親に追従させる（SET2-5 §6） */
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  /* クラスの display 指定が UA の [hidden] に勝ってしまうので明示的に潰す */
  [hidden] { display: none !important; }

  :root {
    --dark: #0b0b10;
    --dark-fg: #6f6f82;
    --cue-bg: #f2efe4;
    --cue-fg: #16161c;
    --win: #4ec98a; --lose: #e5695f; --draw: #d8b34a; --muted: #8a8a9e;
  }

  body {
    background: var(--dark); color: #e8e8ef;
    font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* 入力領域は画面全体。ボタンを狙う時間が反応時間に混ざらないようにする（§4.2） */
  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.2rem; padding: 1.5rem; box-sizing: border-box; text-align: center;
    touch-action: manipulation;
  }

  /* 合図はここで一段に切り替わる。transition は絶対に付けない（§3.3） */
  #stage.cue { background: var(--cue-bg); color: var(--cue-fg); }

  #face { font-size: clamp(72px, 26vmin, 190px); line-height: 1; visibility: hidden; }
  #stage.cue #face, #stage.result #face { visibility: visible; }
  #stage.armed #face { visibility: hidden; }

  #lead { font-size: clamp(20px, 6vmin, 34px); font-weight: 700; letter-spacing: .08em; }
  #stage.armed #lead { color: var(--dark-fg); font-weight: 400; }
  #sub { color: var(--muted); font-size: clamp(12px, 3.4vmin, 15px); max-width: 30rem; white-space: pre-line; }
  #stage.cue #sub { color: #5a5a66; }

  .times { display: grid; grid-template-columns: auto auto; gap: .15rem 1.2rem; font-variant-numeric: tabular-nums; }
  .times .k { color: var(--muted); text-align: right; font-size: .9em; }
  .times .v { text-align: left; font-weight: 700; }
  .win { color: var(--win); } .lose { color: var(--lose); } .draw { color: var(--draw); }

  button {
    font: inherit; font-weight: 700; padding: .85rem 2rem; border-radius: 999px;
    border: 2px solid currentColor; background: transparent; color: inherit; cursor: pointer;
    min-height: 48px; touch-action: manipulation;
  }
  .rule { font-size: clamp(14px, 4vmin, 18px); line-height: 2; }
  .rule b { font-size: 1.15em; }
  .note { font-size: clamp(11px, 3vmin, 13px); color: var(--muted); }
  /* 合図待ちと合図の間は接続表示も消す。合図の直前に何かが変われば、それ自体が手がかりになる */
  #stage.armed #status, #stage.cue #status { visibility: hidden; }
  .dot { display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: var(--lose); vertical-align: middle; }
  .dot.on { background: var(--win); }

  /* 動きを減らす設定。合図はもともと無アニメーションなので結果表示だけ簡略化 */
  @media (prefers-reduced-motion: no-preference) {
    #stage.result #lead { animation: pop .18s ease-out; }
  }
  @keyframes pop { from { transform: scale(.94); } to { transform: scale(1); } }
</style>
</head>
<body>
  <div id="stage">
    <div id="face">🥺</div>
    <div id="lead">接続しています</div>
    <div id="times" class="times" hidden></div>
    <div id="sub"></div>
    <button id="action" hidden></button>
    <div id="status" class="note"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
